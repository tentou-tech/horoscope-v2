- name: storymainnet
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: DATABASE_URL_STORY_MAINNET
      isolation_level: read-committed
      use_prepared_statements: false
  customization:
    naming_convention: hasura-default
    root_fields:
      namespace: storymainnet
    type_names:
      prefix: storymainnet_
  tables: '!include storymainnet/tables/tables.yaml'
